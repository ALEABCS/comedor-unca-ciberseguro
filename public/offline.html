<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c32" />
    <title>Sin conexión · Comedor UNCA</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f8f5; color: #123c32; font: 16px system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; }
      h1 { font-size: 1.6rem; }
      .brand { display: grid; justify-items: center; gap: 8px; margin-bottom: 24px; }
      .brand img:first-child { width: 118px; height: 98px; object-fit: contain; }
      .brand img:last-child { width: 166px; height: 42px; padding: 2px 5px; object-fit: contain; border-radius: 4px; background: white; }
      p { line-height: 1.6; color: #52645a; }
      button { border: 0; border-radius: 8px; padding: 12px 18px; color: white; background: #286149; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/branding/comedor-logo.webp" alt="Comedor Universitario de la Universidad Nacional de Catamarca" width="118" height="98" />
        <img src="/branding/unca-wordmark.webp" alt="Universidad Nacional de Catamarca — UNCA" width="166" height="42" />
      </div>
      <h1>Estás sin conexión</h1>
      <p>Conectate a Internet para volver a cargar el sistema. Las reservas, pagos y validaciones de tickets requieren conexión y no funcionan sin conexión.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
